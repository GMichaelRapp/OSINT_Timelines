<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build sourced, filterable timelines with OSINT Style Guide citations. One file, no server.">
<title>OSINT Timeline Builder</title>
<script id="theme-early">(function () { try { var t = localStorage.getItem('osint-timeline-theme-v1'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();</script>
<style>
/* Layout: app bar with View/Edit; View = case-file ledger with swimlane overview + dispute sidebar; Edit = list/form split panes. Tokens follow the OSINT Citation Generator family. */
:root {
  --bg: #EEF2F5; --surface: #FFFFFF; --sheet: #F7F9FB; --ink: #13222C; --muted: #566977; --faint: #8796A2; --line: #CCD6DE;
  --accent: #0F4761; --accent-ink: #FFFFFF; --accent-soft: #DFEBF1; --hi: #FFF4CC;
  --z-green: #C6E0B4; --z-yellow: #FFE699; --z-orange: #F8CBAD; --z-red: #FF9999; --z-gray: #D9D9D9; --z-ink: #1B242B;
  --fix: #9E2219; --fix-bg: #FBE3E0; --check: #6F4B00; --check-bg: #FBEDC4; --ok: #2A6637;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-read: 'Iowan Old Style', 'Charter', 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; }
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui) }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1200px; margin: 0 auto }
code { font-family: var(--font-mono); font-size: .92em }
[hidden] { display: none !important }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px }
.brand { font-weight: 700; font-size: 14px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap }
.brand svg { flex: none }
.brand small { font-weight: 400; color: var(--muted) }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.tabs button { border: 0; background: transparent; padding: 5px 14px; cursor: pointer; font-weight: 500; font-size: 13.5px }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--fix); border-color: var(--fix) }
.btn.small { padding: 3px 8px; font-size: 12.5px }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px }
.menu { position: relative }
.menu > summary { list-style: none }
.menu > summary::-webkit-details-marker { display: none }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); min-width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; z-index: 40 }
.menu-pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13.5px }
.menu-pop button:hover { background: var(--accent-soft) }
.menu-pop small { display: block; color: var(--muted); font-size: 12px }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.status { font-size: 12px; color: var(--muted); white-space: nowrap }
select.theme { font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }

/* ---------- VIEW ---------- */
.v-head { padding-block: 34px 14px; display: grid; gap: 10px }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.v-title { font-family: var(--font-read); font-weight: 600; font-size: clamp(32px, 5vw, 50px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.dek { max-width: 70ch; color: var(--muted); font-size: 16px; margin: 0 }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted) }
.meta b { color: var(--ink); font-weight: 600 }
.meta .vtag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--ink) }
.foot .vline { margin: 0 0 6px }
.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 6px; margin-block: 6px 16px }
.overview h2 { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 500 }
.ov-scroll { overflow-x: auto }
.lanes { display: block; width: 100%; height: auto; min-width: 720px }
.lanes text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted) }
.lanes .ll { font-family: var(--font-ui); font-size: 11.5px; fill: var(--ink) }
.lanes .g { stroke: var(--line); stroke-width: 1 }
.lanes circle { cursor: pointer }
.lanes circle:hover { stroke: var(--ink); stroke-width: 1.5 }
.lanes .dim { opacity: .15 }
.vbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px)); z-index: 10; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.search { flex: 1 1 240px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
.chip { font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c) }
.chip .n { color: var(--faint); font-family: var(--font-mono); font-size: 11px }
.chip[aria-pressed="false"] { color: var(--faint); background: transparent }
.chip[aria-pressed="false"] .sw { background: transparent; border: 1.5px solid var(--c) }
.chip.zone .sw { border-radius: 2px; background: var(--zc); border: 1px solid var(--line) }
.chip.zone[aria-pressed="false"] .sw { background: transparent }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; padding-block: 16px 60px }
@media (max-width: 920px) { .vgrid { grid-template-columns: minmax(0, 1fr) } .side { order: -1 } }
.year { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 0 14px; margin-bottom: 6px }
.year-h { font-family: var(--font-read); font-size: 30px; font-weight: 600; line-height: 1; padding-top: 12px }
.entries { border-left: 1px solid var(--line) }
.ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0 12px 14px; border-top: 1px solid var(--line); position: relative; scroll-margin-top: 170px }
.entries .ev:first-child { border-top: 0 }
.ev::before { content: ""; position: absolute; left: -4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.ev.key::before { left: -6px; top: 15px; width: 11px; height: 11px; box-shadow: 0 0 0 3px var(--bg) }
.ev.flash { background: var(--hi) }
.date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums }
.date .p { display: block; font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em }
.txt { font-family: var(--font-read); font-size: 17px; line-height: 1.45; margin: 0; max-width: 72ch; overflow-wrap: anywhere }
.ev.key .txt { font-weight: 600 }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; font-size: 12px; color: var(--muted); align-items: center }
.tag-thread { color: var(--c); font-weight: 600 }
.badge { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted) }
.rate { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: var(--zc); color: var(--z-ink) }
details.src { margin-top: 6px }
details.src > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center }
details.src > summary::-webkit-details-marker { display: none }
details.src > summary::before { content: "▸"; font-size: 10px; transition: transform .15s }
details.src[open] > summary::before { transform: rotate(90deg) }
.cites { display: grid; gap: 8px; margin-top: 8px }
.cite { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0 }
.fn { font-family: var(--font-read); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere }
.fn a { overflow-wrap: anywhere }
.cite blockquote { margin: 7px 0 0; font-family: var(--font-read); font-style: italic; font-size: 14px; border-left: 2px solid var(--line); padding-left: 9px; overflow-wrap: anywhere }
.cite .cnote, .notes { font-size: 12.5px; color: var(--muted); margin-top: 5px; overflow-wrap: anywhere }
.notes b { color: var(--ink) }
.empty { padding: 40px 0; color: var(--muted) }
.side { display: grid; gap: 16px; position: sticky; top: 160px; max-height: calc(100vh - 180px); overflow: auto; padding-right: 2px }
@media (max-width: 920px) { .side { position: static; max-height: none; overflow: visible } .vbar { position: static } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px }
.panel h3 { font-family: var(--font-read); font-size: 19px; margin: 0 0 4px }
.panel .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 8px }
.panel details { border-top: 1px solid var(--line); padding: 8px 0 }
.panel details summary { cursor: pointer; font-weight: 500; font-size: 13.5px }
.panel details p { font-size: 13px; margin: 6px 0 }
.panel ul { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 7px }
.refs { display: flex; flex-wrap: wrap; gap: 4px }
.refs button { font: 11px var(--font-mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--accent); cursor: pointer }
.legend { display: grid; gap: 6px; font-size: 12.5px }
.legend div { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px }
.legend .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-top: 5px }
.legend small { display: block; color: var(--muted) }
.zgrid { display: grid; grid-template-columns: auto repeat(6, 1fr); gap: 2px; font: 10.5px var(--font-mono); margin-top: 6px }
.zgrid span { text-align: center; padding: 2px 0; border-radius: 2px; color: var(--z-ink) }
.zgrid .h { color: var(--muted); background: none }
.foot { padding-block: 24px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line) }
@media (max-width: 560px) {
  .year { grid-template-columns: minmax(0, 1fr) } .year-h { padding: 16px 0 4px }
  .ev { grid-template-columns: minmax(0, 1fr) }
}

/* ---------- EDIT ---------- */
.etabs { display: flex; flex-wrap: wrap; gap: 4px; padding-block: 14px 10px; border-bottom: 1px solid var(--line) }
.etabs button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--muted) }
.etabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink) }
.etabs .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-left: 3px }
.split { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 20px; padding-block: 16px 60px; align-items: start }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr) } }
.listcol { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px) + 10px); max-height: calc(100vh - 90px); min-width: 0 }
@media (max-width: 860px) { .listcol { position: static; max-height: 46vh } }
.list { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px }
.li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0 }
.li:hover { background: var(--sheet) }
.li[aria-current="true"] { background: var(--accent-soft) }
.li .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px }
.li .l1 { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.li .l2 { font: 11.5px var(--font-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.li .warn { color: var(--fix) }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0 }
.form h2 { font-family: var(--font-read); font-size: 22px; margin: 0 }
.form h3 { font-family: var(--font-read); font-size: 17px; margin: 18px 0 0 }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field > span { font-size: 12.5px; font-weight: 600 }
.field > small { font-size: 12px; color: var(--muted) }
.field input[type=text], .field input:not([type]), .field select, .field textarea, .inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); min-width: 0 }
.field textarea { resize: vertical; min-height: 64px }
.field.wide { grid-column: 1 / -1 }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; min-width: 0 }
legend { font-size: 12.5px; font-weight: 600; padding: 0 4px }
.citeed { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--sheet) }
.citeed .top { display: grid; grid-template-columns: minmax(0, 1fr) 160px auto; gap: 8px; align-items: end }
@media (max-width: 560px) { .citeed .top { grid-template-columns: minmax(0, 1fr) } }
.preview { font-family: var(--font-read); font-size: 14px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--surface); overflow-wrap: anywhere }
.checks { display: grid; gap: 4px; font-size: 12.5px }
.checks div { padding: 4px 8px; border-radius: 4px }
.checks .fix { background: var(--fix-bg); color: var(--fix) }
.checks .check { background: var(--check-bg); color: var(--check) }
.checks .note { background: var(--accent-soft); color: var(--ink) }
.quals { display: grid; gap: 8px }
.quals .grp { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px }
.quals .grp b { width: 100%; font-size: 12px; color: var(--muted); font-weight: 600 }
.rating-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px }
.trow { display: grid; grid-template-columns: 120px minmax(120px, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
@media (max-width: 700px) { .trow { grid-template-columns: 1fr 1fr } }
.swatches { display: flex; flex-wrap: wrap; gap: 4px }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; background: var(--c); cursor: pointer; padding: 0 }
.swatches button[aria-pressed="true"] { border-color: var(--ink) }
.audit { display: grid; gap: 6px }
.audit .item { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 13.5px; padding: 6px 8px; border-radius: 6px }
.audit .item.fix { background: var(--fix-bg) } .audit .item.check { background: var(--check-bg) }
.audit .lvl { font: 600 11px var(--font-mono); text-transform: uppercase; padding-top: 2px }
.audit .fix .lvl { color: var(--fix) } .audit .check .lvl { color: var(--check) }
.ok { color: var(--ok); font-weight: 600 }
.hint { font-size: 13px; color: var(--muted); margin: 0 }
.dlist { display: grid; gap: 12px }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(5, 12, 18, .5); z-index: 50; display: grid; place-items: center; padding: 16px }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: grid; gap: 12px }
.modal h3 { margin: 0; font-family: var(--font-read); font-size: 21px }
.modal p { margin: 0; font-size: 14px }
.modal textarea { width: 100%; min-height: 160px; font: 12px var(--font-mono); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet) }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
@media print { .appbar, .vbar, .side, .overview { display: none } }

/* ---------- the background ---------- */
.bg { max-width: 780px; margin: 4px 0 22px; position: relative; scroll-margin-top: calc(var(--appbar-h, 46px) + 12px) }
.bg-h { font-family: var(--font-read); font-size: clamp(22px, 2.6vw, 28px); font-weight: 600; margin: 6px 0 8px; letter-spacing: -.01em }
.prose { font-family: var(--font-read); font-size: 17px; line-height: 1.6; overflow-wrap: break-word }
.prose > :first-child { margin-top: 0 }
.prose p, .prose ul, .prose ol, .prose blockquote { margin: 0 0 14px }
.prose h3, .prose h4, .prose h5 { font-family: var(--font-read); margin: 22px 0 8px; line-height: 1.25 }
.prose h3 { font-size: 21px } .prose h4 { font-size: 18px } .prose h5 { font-size: 16px }
.prose blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); font-style: italic }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 }
.prose ul, .prose ol { padding-left: 22px }
.prose li { margin-bottom: 4px }
.prose .mfig { margin: 6px 0 18px; font-family: var(--font-ui) }
.prose .flash, .bg-notes .flash { background: var(--hi); border-radius: 3px; transition: background .4s }
.fnref { font-family: var(--font-ui); font-size: 11px; line-height: 0; margin-left: 1px; vertical-align: super }
.fnsep { color: var(--muted); margin-right: 1px }
.fnref a { text-decoration: none; font-weight: 600; padding: 0 2px; border-radius: 3px; color: var(--accent) }
.fnref a:hover, .fnref a:focus-visible { background: var(--accent-soft) }
.fnref.broken, .broken { color: var(--fix) }
a.evlink { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px }
a.evlink:hover { color: var(--accent) }
.bg-notes { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px }
.bg-notes h3 { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500 }
.bg-notes ol { margin: 0; padding-left: 26px; display: grid; gap: 10px }
.bg-notes li { scroll-margin-top: 160px; padding: 2px 4px; margin-left: -4px } .bg-notes li::marker { font: 600 12px var(--font-mono); color: var(--muted) }
.bg-notes .fn { font-size: 14px }
.bg-notes blockquote { margin: 6px 0 0; font-family: var(--font-read); font-style: italic; font-size: 14px; border-left: 2px solid var(--line); padding-left: 9px }
.bg-notes .cnote { font-size: 12.5px; color: var(--muted); margin-top: 4px }
.bg-notes .bk { text-decoration: none; margin-left: 4px; font-family: var(--font-ui); font-size: 13px }
.bg.shut .bg-body { max-height: 24em; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent) }
.bg-more { margin-top: 8px }
.fnpop { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 10px 12px 12px; display: grid; gap: 6px; max-height: 60vh; overflow: auto }
.fnpop-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px } .fnpop-h b { flex: 1 }
.fnpop-x { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px }
.fnpop .fn { font-size: 14px } .fnpop blockquote { margin: 0; font-family: var(--font-read); font-style: italic; font-size: 13.5px; border-left: 2px solid var(--line); padding-left: 9px } .fnpop .cnote { font-size: 12.5px; color: var(--muted) }

/* ---------- media ---------- */
.mfig { margin: 0; display: grid; gap: 6px; min-width: 0 }
.mfig figcaption { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-family: var(--font-ui) }
.mfig figcaption .mcap { color: var(--ink); flex-basis: 100% } .mfig figcaption .mlead { color: var(--ink) }
.mmeta .cr { font-style: italic } .mmeta i { font-style: normal; color: var(--faint) }
.mopen { color: var(--accent); font-size: 12.5px }
details.msrc { flex-basis: 100% } details.msrc > summary { cursor: pointer; color: var(--accent); font-size: 12.5px; width: fit-content }
details.msrc .fn { margin-top: 4px; padding: 6px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; color: var(--ink) }
.mzoom { display: block; width: 100%; padding: 0; border: 0; background: var(--sheet); cursor: zoom-in; border-radius: 6px; overflow: hidden }
.mzoom img { display: block; width: 100%; height: auto; max-height: 460px; object-fit: contain }
.mzoom:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.mempty { font-size: 13px; color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 8px }
.evmedia { display: grid; gap: 12px; margin-top: 10px; max-width: 620px; grid-template-columns: minmax(0, 1fr) }
.evmedia.many { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.evmedia.many .k-image .mzoom { aspect-ratio: 4 / 3 } .evmedia.many .k-image .mzoom img { height: 100%; max-height: none; object-fit: cover }
.evmedia.many > :not(.k-image) { grid-column: 1 / -1 }
@media (max-width: 480px) { .evmedia.many { grid-template-columns: minmax(0, 1fr) } }
.mcmp { position: relative; overflow: hidden; border-radius: 6px; background: var(--sheet); user-select: none; touch-action: pan-y }
.mcmp img { display: block; width: 100%; height: auto; pointer-events: none }
.mcmp .cmp-a { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--x, 50%)) 0 0) } .mcmp .cmp-a img { width: 100%; height: 100%; object-fit: cover }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); pointer-events: none }
.cmp-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #13222C; display: grid; place-items: center; font-size: 12px; letter-spacing: -1px; box-shadow: 0 1px 4px rgba(0,0,0,.35) }
.cmp-l { position: absolute; top: 8px; padding: 3px 8px; border-radius: 4px; background: rgba(6,12,18,.68); color: #fff; font: 600 11.5px var(--font-ui); pointer-events: none; max-width: 45% }
.cmp-l.l { left: 8px } .cmp-l.r { right: 8px }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; -webkit-appearance: none; appearance: none }
.mcmp:focus-within .cmp-knob { outline: 3px solid var(--accent); outline-offset: 2px }
.mplay { position: relative; background: #0b1218; border-radius: 6px; overflow: hidden; width: 100%; aspect-ratio: 16 / 9 }
.mplay iframe, .mplay video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000 }
.mplay.membed { background: var(--sheet); aspect-ratio: auto } .mplay.membed iframe { background: var(--surface) }
.k-audio audio { width: 100%; display: block }
.k-audio.has-art { grid-template-columns: 84px minmax(0, 1fr); column-gap: 12px; align-items: center } .k-audio.has-art .art { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; grid-row: span 2 } .k-audio.has-art figcaption { grid-column: 2 }
.mface { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 16px; cursor: pointer; color: #fff; background: radial-gradient(ellipse at 50% 40%, #24323c, #0b1218 75%); display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; font: inherit }
.mface .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .72 }
.mface .mplaybtn { position: relative; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.94); box-shadow: 0 2px 10px rgba(0,0,0,.4) }
.mface .mplaybtn::after { content: ""; position: absolute; left: 24px; top: 18px; border-left: 18px solid #13222C; border-top: 12px solid transparent; border-bottom: 12px solid transparent }
.mface:hover .mplaybtn, .mface:focus-visible .mplaybtn { transform: scale(1.06); background: #fff }
.mface:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px }
.mface-t { position: relative; font-weight: 600; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 46ch }
.mface-n { position: relative; font-size: 11.5px; opacity: .85; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 46ch }
.membed .mface { color: var(--ink); background: repeating-linear-gradient(135deg, var(--sheet) 0 12px, var(--surface) 12px 24px); border: 1px dashed var(--line); border-radius: 6px }
.membed .mface-t, .membed .mface-n { text-shadow: none } .membed .mplaybtn { background: var(--accent) } .membed .mplaybtn::after { border-left-color: var(--accent-ink) }
.badge.mb { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft) }
.mlb { position: fixed; inset: 0; z-index: 60; background: rgba(4, 9, 13, .92); display: grid; place-items: center; padding: 48px 56px 24px }
.mlb figure { margin: 0; display: grid; gap: 10px; max-width: 100%; max-height: 100%; justify-items: center }
.mlb img { max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain; display: block; border-radius: 4px }
.mlb figcaption { color: rgba(255,255,255,.82); font-size: 13.5px; max-width: 80ch; display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: center; text-align: center }
.mlb figcaption .mcap, .mlb figcaption .mlead { color: #fff } .mlb .mmeta i { color: rgba(255,255,255,.5) } .mlb details.msrc { display: none }
.mlb button { position: absolute; border: 0; background: rgba(255,255,255,.12); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer }
.mlb button:hover, .mlb button:focus-visible { background: rgba(255,255,255,.26) }
.mlb-x { top: 10px; right: 12px } .mlb-p { left: 8px; top: 50%; margin-top: -21px } .mlb-n { right: 8px; top: 50%; margin-top: -21px }
@media (max-width: 620px) { .mlb { padding: 52px 8px 16px } .mlb-p, .mlb-n { top: auto; bottom: 10px } .prose { font-size: 16px } }
@media print { .mface-n, .cmp-range, .bg-more, .fnpop, .mlb { display: none } .bg.shut .bg-body { max-height: none; -webkit-mask-image: none; mask-image: none } }

/* ---------- editing the background and media ---------- */
.bged { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; padding-block: 16px 60px; align-items: start }
.bgprev-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px) + 10px); max-height: calc(100vh - 90px); overflow: auto; min-width: 0 }
.bgprev { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 16px 14px }
.bgprev .bg { margin: 0 } .bgprev .prose { font-size: 16px }
@media (max-width: 1000px) { .bged { grid-template-columns: minmax(0, 1fr) } .bgprev-col { position: static; max-height: none } }
.mdbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 0 2px }
.mdbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px }
#bgText { min-height: 340px; font: 14px/1.55 var(--font-mono); resize: vertical }
.citeed .top.bgtop { grid-template-columns: auto minmax(0, 1fr) 150px auto }
@media (max-width: 700px) { .citeed .top.bgtop { grid-template-columns: minmax(0, 1fr) } }
.mid { font: 12px var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; white-space: nowrap; align-self: center }
.mitems { display: grid; gap: 10px }
.mitem { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--sheet); display: grid; gap: 8px }
.mi-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap } .mi-head .sp { flex: 1 }
.mi-head select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 600; font-size: 13px }
.mthumbs { display: flex; gap: 8px } .thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--surface) }
.row.nowrap { flex-wrap: nowrap } .grow { flex: 1; min-width: 0 }
.mlocal { color: var(--check) !important } .mlocal code { font-size: 11.5px }
input.bad { border-color: var(--fix) !important; box-shadow: 0 0 0 1px var(--fix) }
#mprev { margin-top: 6px } #mprev .evmedia { margin-top: 0 }

", "descType": "Internal Document", "descDetails": "ECF No. 232-6", "date": "2015-04-16", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.232.6.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.232.6.pdf"}}, {"id": "s44", "fields": {"type": "archival", "authors": "US District Court for the Southern District of New York", "title": "Opinion and Order denying motion for a new trial", "titleStyle": "plain", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Court Opinion", "descDetails": "ECF No. 237", "date": "2015-04-27", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.237.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.237.0.pdf"}}, {"id": "s45", "fields": {"type": "archival", "authors": "US Attorney's Office for the Southern District of New York", "title": "Government's memorandum in opposition to the motion to dismiss", "titleStyle": "plain", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Legal Brief", "descDetails": "ECF No. 26", "date": "2014-04-28", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.26.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.26.0.pdf"}}, {"id": "s46", "fields": {"type": "archival", "authors": "US District Court for the Southern District of New York", "title": "Opinion and Order", "titleStyle": "quotes", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Court Opinion", "descDetails": "ECF No. 42", "date": "2014-07-09", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.42.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.42.0.pdf"}}, {"id": "s49", "fields": {"type": "archival", "authors": "Christopher Tarbell", "title": "Declaration of Christopher Tarbell", "titleStyle": "quotes", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Sworn Declaration", "descDetails": "ECF No. 57", "date": "2014-09-05", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.57.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.57.0.pdf"}}, {"id": "s54", "fields": {"type": "archival", "authors": "US District Court for the Southern District of New York", "title": "Opinion and Order", "titleStyle": "quotes", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Court Opinion", "descDetails": "ECF No. 89", "date": "2014-10-10", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.89.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.89.0.pdf"}}, {"id": "s55", "fields": {"type": "archival", "authors": "US District Court for the Southern District of New York", "title": "Opinion and Order", "titleStyle": "quotes", "location": "United States v. Ulbricht, No. 14-cr-68 (S.D.N.Y.)", "descType": "Court Opinion", "descDetails": "ECF No. 94", "date": "2014-10-24", "url": "https://storage.courtlistener.com/recap/gov.uscourts.nysd.422823/gov.uscourts.nysd.422823.94.0.pdf", "access": [], "quals": [], "note": "", "file": "gov.uscourts.nysd.422823.94.0.pdf"}}, {"id": "s56", "fields": {"type": "live", "authors": "CourtListener", "title": "Docket for United States v. Ulbricht, 1:14-cr-00068", "titleStyle": "plain", "location": "CourtListener RECAP Archive", "descType": "Docket Sheet", "descDetails": "CSV export", "publisher": "Free Law Project", "accessed": "22 October 2026", "access": [], "quals": [], "note": "", "file": "united-states-v-ulbricht.nysd.4353251.2026-10-22.csv"}}], "events": [{"id": "C004", "date": "2011-01-27", "prec": "exact", "thread": "market", "key": true, "text": "Testimony of SA Gary Alford: user \"Altoid\" registered on shroomery.org on January 27, 2011 and posted that day pointing readers to SilkRoad420.wordpress.com; the shroomery registration email went to RossUlbricht@gmail.com.", "actors": "SA Gary Alford; \"Altoid\"", "cites": [{"src": "s29", "loc": "p. 47, Tr. 1272:13-16", "quote": "shroomery message board account has been created. Date is 1/27/2011, 6:22 p.m."}], "notes": "GX 304, 305, 308-A. Shroomery post date (January 27, 2011) at Tr. 1261:25-1262:1; registration and post same day at Tr. 1263:4-10."}, {"id": "C007", "date": "2011-02-06", "prec": "range", "thread": "market", "key": true, "text": "Testimony of Brian Shaw: Silk Road's transaction database covered February 6, 2011 through October 2, 2013, with 1,530,252 transactions worth 9,912,070.05 bitcoins (about $213.9 million at recorded values) and commissions of 642,455.36 bitcoins (about $13.2 million).", "actors": "Brian Shaw (FBI contractor)", "cites": [{"src": "s32", "loc": "pp. 82-84, Tr. 1924:23-1926:7", "quote": "it covered February 6, 2011 through October 2, 2013, so the entirety of what was in the database."}], "notes": "Range end 2013-10-02. Totals at Tr. 1926:1-7. The earliest transaction is February 6, 2011, consistent with the government's \"February of 2011\" start (Doc 210, Tr. 1255:1-3); the defense pointed to \"June 18, 2011\" as the start of the site's \"current form\" (Doc 214, Tr. 1406:24-1407:1)."}, {"id": "D002", "date": "2011-06", "prec": "month", "thread": "investigation", "key": true, "text": "HSI Chicago began monitoring unusual drug seizures at the O'Hare international mail branch linked to Silk Road (per HSI Chicago chronology in SA Der-Yeghiayan 3500 material).", "actors": "HSI Chicago", "cites": [{"src": "s42", "loc": "p. 2 (3505-00295)", "quote": "-June of 2011, HSI Chicago started monitoring unusual drugs seizures from the Mail Branch related to the Silk Road"}, {"src": "s23", "loc": "p. 62; Tr. 76:17-76:25", "quote": "This is approximately June 2011. An officer brought to my attention several --"}], "notes": "Defense reply exhibit (ECF 232-6), an HSI Chicago internal chronology; author perspective is HSI Chicago."}, {"id": "D003", "date": "2011-10-13", "prec": "exact", "thread": "investigation", "key": true, "text": "HSI Chicago opened case \"Operation Dime Store\" to document Silk Road-linked mail seizures.", "actors": "HSI Chicago", "cites": [{"src": "s42", "loc": "p. 2 (3505-00295)", "quote": "On October 13, 2011, HSI Chicago opened case Operation Dime Store to document the findings of the seizures coming into the mail branch."}, {"src": "s23", "loc": "p. 60; Tr. 74:3-74:4", "quote": "Q. When was that? A. It was October 2011."}], "notes": "He first heard of the site approx. late Sept/early Oct 2011 (Tr. 88:1). Bitcoin ~$2-4 then (198 Tr. 153:21-22)."}, {"id": "A010", "date": "2012-01", "prec": "approx", "thread": "market", "key": true, "text": "Around January 2012 Silk Road's lead administrator adopted the username Dread Pirate Roberts; DPR signed posts with a PGP key whose private key was later found on Ulbricht's laptop.", "actors": "DPR", "cites": [{"src": "s1", "loc": "p. 16 (App. 14a)", "quote": "Around January 2012, the Silk Road user who represented himself as the lead administrator of the site adopted the username Dread Pirate Roberts."}], "notes": "PGP key recovery: App. 15a."}, {"id": "D007", "date": "2012-02-17", "prec": "approx", "thread": "rogue", "key": true, "text": "Complaint states DEA SA Carl Force began working on the Silk Road investigation (Baltimore task force) on or about this date, and was using PGP as \"Nob\" by about April 2012.", "actors": "Carl Mark Force IV (DEA)", "cites": [{"src": "s6", "loc": "p. 39 (Aff. p. 38); p. 23 n.14", "quote": "On or about February 17, 2012, FORCE began working on the Silk Road investigation."}, {"src": "s15", "loc": "p. 61 (Br. 44)", "quote": "Nor was Force’s investigation into Silk Road transitory or superficial in any respect. It began in February 2012,"}], "notes": "p.23 n.14 says \"approximately February 2012\". OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Gov Nov 21, 2014 letter: \"In 2012 and 2013, SA Force was involved as an undercover agent\" in the D. Md. investigation (Br. 11)."}, {"id": "D012", "date": "2013-01-17", "prec": "exact", "thread": "rogue", "key": true, "text": "Complaint: Force and Bridges were part of the team that arrested Curtis Green (\"C.G.\"/\"Flush\") in a controlled delivery of a kilogram of cocaine; Green turned over his Silk Road admin, Mt. Gox and Dwolla credentials and consented to use of the \"Flush\" identity.", "actors": "Carl Force; Shaun Bridges; Curtis Green", "cites": [{"src": "s6", "loc": "p. 42 (Aff. p. 41)", "quote": "On or about January 17, 2013, FORCE and BRIDGES were part of a team that apprehended C.G. ina controlled delivery for a kilogram of cocaine."}, {"src": "s39", "loc": "p. 3 (Gov. 11/21/2014 sealed ltr p. 3)", "quote": "Green was arrested by SA Force and several other agents involved in the USAO-Baltimore investigation on January 17, 2013."}], "notes": "Green named only as \"C.G.\" in complaint; identified as Curtis Green in SDNY filings. Footnote: DPR cut off Flush access, regained 2013-01-20. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Same date in Gov 12/18/2014 letter (p.56) and Court 12/22/2014 sealed opinion (p.77)."}, {"id": "D015", "date": "2013-01-25", "prec": "exact", "thread": "rogue", "key": true, "text": "Bridges admitted that on or about this date he used another person's Silk Road administrator account to reset passwords/PINs and move ~20,000 Bitcoin (~$350,000) from vendor accounts into a wallet he controlled.", "actors": "Shaun W. Bridges (USSS)", "cites": [{"src": "s10", "loc": "p. 11, Tr. 11:2-13; Tr. 16:1-17:2", "quote": "move approximately 20,000 Bitcoins from various 11 Silk Road vendor accounts into a wallet, which he exercised 12 control"}, {"src": "s6", "loc": "p. 43-44 (Aff. p. 42-43)", "quote": "On January 25, 2013, during the afternoon and into the night, the Silk Road website suffered a series of sizeable thefts."}, {"src": "s1", "loc": "p. 11 (App. 9a)", "quote": "in January 2013, Bridges used the Flush username to change other users’ passwords, empty their Bitcoin wallets,7 and keep $350,000 in Bitcoins in offshore bank accounts"}, {"src": "s15", "loc": "p. 48 (Br. 31)", "quote": "“[i]n late January 2013, members of the Baltimore Silk Road Task Force, to include BRIDGES and FORCE, gained access to a Silk Road administrator account"}], "notes": "Plea factual basis (Aug. 31, 2015). Contrasts with SDNY sealed filings attributing the theft suspicion to Force/Green (230.1 p.3-4). SDNY sealed letters date the theft report 2013-01-26. Bridges reportedly left the proffer early. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. The \"7\" after wallets is a footnote marker in the source. Conflict: the gov Nov 21, 2014 pretrial disclosure attributed this $350,000 theft to Force; the complaint attributes it to Bridges (App. 9a n.8)."}, {"id": "D024", "date": "2013-01-29", "prec": "exact", "thread": "rogue", "key": true, "text": "TorChat log: \"Nob\" quoted $80,000 for the killing of Green and DPR agreed to proceed; Force later staged Green's death and DPR paid $80,000 (documented in Force's reports).", "actors": "Nob (SA Force); DPR/Ulbricht", "cites": [{"src": "s39", "loc": "p. 51 (Ex. A); p. 4", "quote": "(2013-01-29 12:48) Nob: my guy got back to me at quoted 80K for the hit"}, {"src": "s18", "loc": "p. 4", "quote": "On January 26, 2013, CC-1 informed Ulbricht that he had determined that the Employee was responsible for the theft of bitcoins from various vendor accounts."}], "notes": "Staging and $80,000 payment described in Gov 11/21/2014 letter p.4; no date given there for the staging. 2d Cir identifies this as the \"Flush\" (Curtis Green) hit: DPR paid Nob (Force) $80,000 and Force faked the murder; charged separately in D. Md. No. 13-0222-CCB (App. 17a n.15). Conflict: 2d Cir says gov did not present the Flush murder-for-hire at trial, while ECF 142 (pretrial) granted gov leave to offer it."}, {"id": "A026", "date": "2013-03-31", "prec": "exact", "thread": "market", "key": true, "text": "Government alleged DPR and redandwhite agreed on 1,670 bitcoins (about $150,000) for the murder of FriendlyChemist and DPR sent payment.", "actors": "DPR; redandwhite", "cites": [{"src": "s18", "loc": "p. 7", "quote": "Through further messages exchanged on March 31, 2013, DPR and redandwhite agreed upon a price of 1,670 bitcoins (approximately $150,000) for the murder-for-hire."}, {"src": "s32", "loc": "pp. 42-44, Tr. 1884:22-1886:2", "quote": "The exchange rate is above 90 right now, so at $90/btc, $150k is about 1670 btc."}], "notes": "Laptop log entries: Mar 28 \"being blackmailed\", Mar 29 \"commissioned hit\" (ECF 142 p.8). GX 630 (blockchain). In the same exchange DPR wrote \"Not long ago, I had a clean hit done for $80k\" (Tr. 1883:12-13) and \"I've only ever commissioned the one other hit\" (Tr. 1884:19-20). Stipulation GX 805 states Canadian authorities have no record of a homicide in White Rock on or about March 31, 2013 (Tr. 1908:23-1909:4)."}, {"id": "D029", "date": "2013-04-01", "prec": "approx", "thread": "rogue", "key": true, "text": "A Silk Road user \"DeathFromAbove\" began messaging DPR accusing him of Curtis Green's disappearance and death; on 2013-04-16 it named Anand Athavale as DPR and demanded $250,000.", "actors": "DeathFromAbove (later attributed to Force); DPR", "cites": [{"src": "s39", "loc": "p. 108 (Gov. 2/1/2015 sealed ltr p. 2)", "quote": "it started on or about April 1, 2013, when “DeathFromAbove” started making accusations that the “Dread Pirate Roberts” was responsible for the disappearance and death of Curtis Green"}, {"src": "s6", "loc": "p. 25-26 (Aff. p. 24-25)", "quote": "On or about April 1, 2013, FORCE created a fictitious persona on the Silk Road website named “Death from Above.”"}, {"src": "s1", "loc": "p. 13 (App. 11a)", "quote": "in one such chat that took place on April 16, 2013, DeathFromAbove told DPR that he knew that DPR’s true identity was Anand Athavale."}], "notes": "NSA-1 complaint dates the itemized-ID message 2013-04-10 rather than 04-16 (see complaint rows). Complaint ties persona to Force via screen-recording video in his DEA case file (Ex. A). OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Gov revealed DeathFromAbove = Force only in a Feb 1, 2015 letter (Br. 29)."}, {"id": "A035", "date": "2013-06", "prec": "approx", "thread": "investigation", "key": true, "text": "Former FBI SA Christopher Tarbell declared that in early June 2013 he and another CY-2 agent found the SR Server's true IP leaking from the Silk Road login/CAPTCHA interface.", "actors": "Christopher Tarbell; FBI CY-2 squad (NY)", "cites": [{"src": "s49", "loc": "p. 3 ¶7", "quote": "In or about early June 2013, another member of CY-2 and I closely examined the traffic data being sent from the Silk Road website"}], "notes": "Contested: defense (Horowitz Decl., ECF 70) called this \"implausible\" given Nginx config. Gov: no other contemporaneous records exist (ECF 70-4 p.4). Gov denied NSA involvement (ECF 75 p.5-6)."}, {"id": "A040", "date": "2013-07-10", "prec": "exact", "thread": "market", "key": true, "text": "U.S. Customs and Border Protection intercepted a package from Canada containing nine counterfeit IDs, all bearing a photo alleged to be Ulbricht's.", "actors": "CBP", "cites": [{"src": "s18", "loc": "p. 12", "quote": "On July 10, 2013—the same day that shefoundme’s package was “inbound out of customs”—federal agents with U.S. Customs and Border Protection (“CPB”) intercepted a package from Canada"}, {"src": "s31", "loc": "pp. 152-155, Tr. 1468:25-1471:23", "quote": "Q. So when, approximately, were these IDs seized by CBP? A. Approximately in the neighborhood of July 10th of 2013."}], "notes": "Jurisdictions listed slightly differently in ECF 108 p.4 (Alberta, New South Wales). GX 400-402. DOB 3/27/1984 on all nine (Tr. 1470:18-23). Matches Silk Road messages in which buyer \"shefoundme\" ordered IDs from \"KingOfClubs\" (Doc 212, Tr. 1794:14-1802:6)."}, {"id": "A043", "date": "2013-07-23", "prec": "exact", "thread": "investigation", "key": true, "text": "After obtaining an Icelandic court order, the Reykjavik Metropolitan Police covertly imaged the SR Server; Tarbell stated the FBI only consulted on timing.", "actors": "Reykjavik Metropolitan Police; FBI", "cites": [{"src": "s49", "loc": "p. 6 ¶12", "quote": "After obtaining the necessary court order under Icelandic law, the RMP imaged the Subject Server on July 23, 2013."}, {"src": "s26", "loc": "p. 113; Tr. 695:17-695:19", "quote": "the U.S. government, got access to the Silk Road servers no later than July 23, 2013, right? A. The FBI did."}, {"src": "s30", "loc": "p. 179, Tr. 1740:19-21", "quote": "The government had access to the servers -- the U.S. government had access to the servers in July of 2013, correct? A. That's what I've been told"}], "notes": "Horowitz: orange21.tar.gz mtime July 23, 2013 matches; three other tarballs dated June 6, 2013 (ECF 70 p.16). RMP imaged by booting single-user mode and tar copying (ECF 70-4 p.7). Witness lacked personal knowledge of location (Tr. 697:7-698:6). Defense summation relied on this, arguing the government let the site run from July to the end of September 2013 (Doc 218, Tr. 2209:4-8). Yum said he received the server IP from the investigative team and could not speak to how it was found (Tr. 1740:5-9)."}, {"id": "B054", "date": "2013-07-26", "prec": "approx", "thread": "investigation", "key": true, "text": "Der-Yeghiayan took over the Silk Road staff account 'cirrus' (consent of prior operator) and began working as an undercover moderator paid by DPR.", "actors": "HSI SA Jared Der-Yeghiayan", "cites": [{"src": "s24", "loc": "p. 146; Tr. 266:22-266:24", "quote": "Approximately July 26, 27th of 2013."}], "notes": "Elsewhere 'late July 2013' (Tr. 265:18). He was not cirrus on July 23 but was by Aug 2 (202 Tr. 630:7-12)."}, {"id": "B061", "date": "2013-09-10", "prec": "approx", "thread": "investigation", "key": true, "text": "IRS SA Gary Alford (NY OCDETF) brought Ross Ulbricht to Der-Yeghiayan's attention; the focus shifted to Ulbricht.", "actors": "HSI SA Jared Der-Yeghiayan; IRS SA Gary Alford", "cites": [{"src": "s24", "loc": "p. 192; Tr. 312:10-312:16", "quote": "It was approximately around September 10th, September 11th, 2013."}], "notes": "He had never heard of Ulbricht before (Tr. 312:8-9; 200 Tr. 460:1-3)."}, {"id": "D046", "date": "2013-09-15", "prec": "exact", "thread": "rogue", "key": true, "text": "DPR paid 770 BTC (~$98,000) to \"French Maid\"; via pass-through addresses the coins reached Force's personal CampBX account between Sept. 23 and 29, 2013.", "actors": "DPR; Carl Force", "cites": [{"src": "s6", "loc": "p. 24 (Aff. p. 23)", "quote": "Silk Road server data reveals that DPR made a payment on September 15, 2013, for 770 bitcoins."}], "notes": "At least 600 BTC moved from CampBX to Force's Bitstamp account in Nov. 2013. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."}, {"id": "A052", "date": "2013-09-17", "prec": "range", "thread": "investigation", "key": true, "text": "FBI obtained several pen registers on Ulbricht's home ISP account, Wi-Fi router, and devices to match his online times with DPR's Silk Road activity; no content or GPS data was collected.", "actors": "FBI; SDNY magistrate judges", "cites": [{"src": "s49", "loc": "p. 8 ¶19", "quote": "During the period from September 17 to September 20, 2013, the FBI obtained several judicially authorized pen registers for the purpose of confirming the identity of Ulbricht as “DPR”"}, {"src": "s54", "loc": "p. 4", "quote": "Pen-Trap Order No. 1: To Comcast re IP address 67.170.232.207 (9/16/13);"}, {"src": "s54", "loc": "p. 4", "quote": "Pen-Trap Order No. 4: Re certain computer devices associated with MAC addresses including 88-53-2E-9C-81-96, (9/20/13); and"}], "notes": "Range end 2013-09-20. Five pen-trap orders total (ECF 89 p.4-5; App. 7a). Defense argued they tracked his location; Tarbell denied (¶21). Conflict: Tarbell says the pen registers were obtained September 17-20, 2013 (ECF 57 ¶19). ECF 89 dates Order No. 2 (Comcast) 9/19/2013; defense memo dates the second Comcast order September 17, 2013 (ECF 48 p.19). Same text in ulbrichtchargesstand.txt. MAC 88-53-2E-9C-81-96 matches the Samsung laptop in Warrant No. 6."}, {"id": "A056", "date": "2013-09-27", "prec": "exact", "thread": "takedown", "key": true, "text": "Ulbricht charged by sealed complaint (S.D.N.Y.) with narcotics-trafficking conspiracy, computer-hacking conspiracy, and money-laundering conspiracy.", "actors": "USAO-SDNY; Ulbricht", "cites": [{"src": "s45", "loc": "p. 8", "quote": "On September 27, 2013, Ulbricht was charged by complaint (the “Complaint”) with one count of conspiring to commit narcotics trafficking"}, {"src": "s26", "loc": "p. 124; Tr. 706:13-706:15", "quote": "this is sworn under oath September 27, 2013 for the purpose of obtaining an arrest warrant against Mr. Ulbricht"}, {"src": "s31", "loc": "p. 114, Tr. 1427:12-13", "quote": "on or about September 27th, 2013, the Honorable Frank Maas signed this criminal complaint"}], "notes": "Gov noted Ulbricht was separately charged in D. Md. for one attempted murder for hire (ECF 26 p.9 n.1). Counsel's statement at sidebar. Der-Yeghiayan: FBI obtained arrest warrant 'sometime late September 2013' (198 Tr. 313:15-19). 614,305 BTC: 204 Tr. 834:21-835:6. Counsel's description, not testimony."}, {"id": "A059", "date": "2013-10-01", "prec": "exact", "thread": "takedown", "key": true, "text": "Ulbricht arrested in a San Francisco public library while logged in as DPR, after Der-Yeghiayan (undercover as admin \"Cirrus\") started a staff chat to get him onto the Silk Road site.", "actors": "Ulbricht; Jared Der-Yeghiayan (HSI); FBI", "cites": [{"src": "s1", "loc": "p. 14 (App. 12a)", "quote": "Ulbricht was arrested in a San Francisco public library on October 1, 2013"}, {"src": "s28", "loc": "pp. 26-27, Tr. 1036:22-1037:17", "quote": "Q. What would have happened if the defendant had closed his laptop before the FBI seized it? A. It would have went into an encrypted state."}, {"src": "s33", "loc": "pp. 98-99, Tr. 2161:8-2162:24", "quote": "after the defendant enters the library at 3:08 p.m. DPR shows up on staff chat."}, {"src": "s27", "loc": "p. 68; Tr. 847:4-847:12", "quote": "The initial arrest was going to be on October 2nd, which is at his residence"}], "notes": "Laptop was seized incident to arrest with the Cirrus chat open and the DPR-only \"Mastermind\" page in use (App. 12a). Library location at Tr. 1037:25-1038:3 (GX 128H). On cross, Kiernan acknowledged telling prosecutors twice that Ulbricht sat with his back to him looking out the window (Tr. 1038:19-1039:8; 3508-2, 3508-7), which conflicts with the seat shown in the photo. Doc 208 is the docketed \"corrected\" 1/22/2015 transcript; original Doc 206 has same text at pp.26-27, Tr. 1056:23-1057:18. Summation characterizes Der-Yeghiayan testimony given on earlier trial days (not in this file set); chat timestamps were UTC (+7). Turner said Der-Yeghiayan took over the cirrus account \"back in July\" (Tr. 2162:15-17). Turner also said the arrest notes in the trash matched DPR forum posts of August 11 and September 12 (Tr. 2163:15-23). Der-Yeghiayan describes plan to chat with DPR while defendant in public (198 Tr. 313:22-315:5)."}, {"id": "A060", "date": "2013-10-01", "prec": "exact", "thread": "takedown", "key": true, "text": "Ulbricht's laptop, seized at arrest, held Bitcoin wallets with over 144,000 Bitcoins worth $16-18 million then; analysis traced nearly 90% to wallets on Silk Road servers.", "actors": "Ulbricht; government", "cites": [{"src": "s44", "loc": "p. 5", "quote": "There were also Bitcoin wallets on the laptop containing over 144,000 Bitcoins, valued at the time of Ulbricht’s arrest at $16-18 million."}, {"src": "s26", "loc": "p. 109; Tr. 691:4-691:8", "quote": "the 144,000 bitcoins that were seized from Mr. Ulbricht's laptop, right? A. Yes."}, {"src": "s30", "loc": "pp. 112-113, Tr. 1673:25-1674:12", "quote": "A. It was approximately 144,000 bitcoins. ... it would have been anywhere between 16- to $18 million."}], "notes": "Date is the arrest/seizure date; actual seizure/forfeiture transfer date not stated. 2d Cir: \"approximately $18 million\" seized, \"about 89%\" from Silk Road servers in Iceland (App. 15a). Seizure date not stated. Contrast government opening '$18 million' (196 Tr. 47:12, 55:14-16). The transfer date is not stated in this transcript; Yum said only that it came after the arrest (\"prior to when I received that wallet file\"). Kiernan's hand-off of wallet.dat to Yum: Doc 208, Tr. 1033:6-8."}, {"id": "A061", "date": "2013-10-02", "prec": "exact", "thread": "takedown", "key": true, "text": "Silk Road website taken down the day after the arrest; Icelandic police seized and re-imaged the SR Server with FBI personnel present.", "actors": "FBI; Reykjavik Metropolitan Police", "cites": [{"src": "s49", "loc": "p. 7 ¶14", "quote": "the arrest of Ulbricht and the takedown of the Silk Road website, which occurred on October 1 and 2, 2013, respectively"}, {"src": "s25", "loc": "p. 74; Tr. 420:15-420:25", "quote": "October 2nd, around -- I think like around 10 a.m., I want to say, 11."}, {"src": "s30", "loc": "p. 85, Tr. 1646:10-20", "quote": "wait for the team that's on-ground in San Francisco, the FBI arrest team, and wait for them to give me a confirmation that the defendant has been arrested."}, {"src": "s6", "loc": "p. 11 (Aff. p. 10)", "quote": "The Silk Road website was established in early 2011 and operated until on or about October 2, 2013, when it was seized by law enforcement."}], "notes": "Tarbell n.8: request asked to let FBI post a seizure banner; seizure/re-imaging performed solely by RMP. Also 196 Tr. 97:12-13. He took one of two mirrored drives from the market server and kept the site running to drain the bitcoin server (Tr. 1647:22-1650:22). Shaw's cross put the market-server image creation date at October 8, 2013 (Doc 216, Tr. 1976:7-23). Ulbricht arrested 2013-10-01 (same complaint p.12). OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."}, {"id": "A065", "date": "2014-02-04", "prec": "exact", "thread": "court", "key": true, "text": "Grand jury returned a four-count indictment: narcotics conspiracy, continuing criminal enterprise, computer-hacking conspiracy, and money-laundering conspiracy.", "actors": "Grand jury (S.D.N.Y.); Ulbricht", "cites": [{"src": "s46", "loc": "p. 1", "quote": "On February 4, 2014, a Grand Jury sitting in the Southern District of New York returned Indictment 14 Cr. 68"}], "notes": ""}, {"id": "A068", "date": "2014-05-04", "prec": "exact", "thread": "rogue", "key": true, "text": "Force resigned from the DEA on May 4, 2014, and on May 8 wired $235,000 to an offshore account in Panama (per complaint, as cited by defense).", "actors": "Carl Force", "cites": [{"src": "s15", "loc": "p. 50 (Br. 33)", "quote": "Force resigned from the DEA May 4, 2014, “shortly after law enforcement began the current investigation.”"}, {"src": "s6", "loc": "p. 8 (Aff. p. 7); p. 36; p. 47", "quote": "FORCE resigned on May 4, 2014, shortly after law enforcement began the current investigation."}, {"src": "s6", "loc": "p. 40 (Aff. p. 39)", "quote": "On or about May 8, 2014, presumably after learning of the government’s investigation and after he had resigned, FORCE wired $235,000 to an offshore account in Panama."}], "notes": "Force interviewed May 30, 2014 (same page). p.47 says letter of resignation submitted \"By May 4, 2014\" effective later that month. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."}, {"id": "A071", "date": "2014-08-21", "prec": "exact", "thread": "court", "key": true, "text": "Superseding Indictment S1 filed with seven counts, adding narcotics distribution, distribution by Internet, and fraudulent-ID conspiracy, plus aiding-and-abetting language.", "actors": "USAO-SDNY; grand jury", "cites": [{"src": "s55", "loc": "p. 2", "quote": "The Superseding Indictment, filed on August 21, 2014, charges Ulbricht with seven crimes"}], "notes": "Count Three also alleged payments of ~$150,000 and ~$500,000 for murders (p.2-3)."}, {"id": "A080", "date": "2014-10-10", "prec": "exact", "thread": "court", "key": true, "text": "Court denied suppression, holding Ulbricht had no personal privacy interest to challenge the investigation that led to the Icelandic server, its imaging, or Warrant Nos. 1-5 and 7.", "actors": "Judge Forrest", "cites": [{"src": "s54", "loc": "p. 26", "quote": "Ulbricht therefore has no basis to challenge as violations of his Fourth Amendment rights: (1) the investigation that preceded and led to the Icelandic server,"}], "notes": "Also held pen-trap info \"entirely appropriate\" (p.33). Opinion lists 14 warrants/orders (p.4). Same text in ulbrichtchargesstand.txt."}, {"id": "A083", "date": "2014-11-21", "prec": "exact", "thread": "court", "key": true, "text": "Gov sent the court a sealed ex parte letter seeking leave to disclose the Force grand-jury investigation to the defense under a protective order.", "actors": "USAO-SDNY; Judge Forrest", "cites": [{"src": "s1", "loc": "p. 52 (App. 50a)", "quote": "on November 21, 2014, the government wrote a sealed ex parte letter to the district court seeking permission to disclose to the defense information about the Force grand jury investigation"}, {"src": "s39", "loc": "p. 1-6", "quote": "He is now being investigated by USAO-San Francisco for, among other things, leaking information about USAO- Baltimore’s investigation to Ulbricht in exchange for payment"}], "notes": "Letter said Force was the undercover agent Ulbricht allegedly hired for the D. Md. murder-for-hire (Br. 24). Letter asserts Force \"played no role\" in SDNY investigation and info is not Brady. Bridges was not mentioned (Gov. ECF 230 p.12 n.1: he became a target later)."}, {"id": "A091", "date": "2015-01-13", "prec": "exact", "thread": "trial", "key": true, "text": "Trial began in S.D.N.Y.; defense conceded in opening that Ulbricht created Silk Road but argued he left and was later framed.", "actors": "Judge Forrest; Ulbricht; Joshua Dratel", "cites": [{"src": "s1", "loc": "p. 15 (App. 13a)", "quote": "Ulbricht’s trial lasted approximately three weeks, from January 13 through February 4, 2015."}, {"src": "s23", "loc": "p. 28; Tr. 42:12-42:24", "quote": "in 2009 began what he described as, quote, a secret project. Using his laptop computer, he created the Silk Road website."}], "notes": "One-week delay from Jan 5 due to a personal matter of a government attorney (ECF 237 p.2 n.1). Government opening; allegation, not evidence."}, {"id": "A094", "date": "2015-02-01", "prec": "exact", "thread": "trial", "key": true, "text": "Shortly before resting, government disclosed by letter that the account \"DeathFromAbove\" appeared to be controlled by former SA Force.", "actors": "USAO-SDNY", "cites": [{"src": "s15", "loc": "p. 46 (Br. 29)", "quote": "it appears that “DeathFromAbove,” was controlled by former Special Agent Force"}, {"src": "s39", "loc": "p. 110-111", "quote": "the Government consulted with the lead Assistant U.S. Attorney handling the Force investigation, who provided evidence that Force controlled the “DeathFromAbove” account"}], "notes": "Defense was barred from using the DeathFromAbove chats (App. 21a). Gov. ECF 230 p.16, 26 n.10: SDNY learned this only during trial. Exclusion: Tr. 1871-73 per ECF 230 p.16."}, {"id": "A096", "date": "2015-02-04", "prec": "exact", "thread": "trial", "key": true, "text": "Jury convicted Ulbricht on all seven counts after about three and a half hours of deliberation.", "actors": "Jury; Ulbricht", "cites": [{"src": "s1", "loc": "p. 25 (App. 23a)", "quote": "After deliberating for about three and a half hours, the jury returned a guilty verdict on all seven counts in the Indictment."}, {"src": "s34", "loc": "pp. 84-87, Tr. 2334:3-2337:5", "quote": "As to Count One, how do you find the defendant? Guilty."}, {"src": "s44", "loc": "p. 2", "quote": "On February 4, 2015, after just a few hours of deliberation, the jury returned guilty verdicts on all counts."}, {"src": "s34", "loc": "p. 79, Tr. 2329:25", "quote": "(At 11:55 a.m., the jury retired to deliberate)"}], "notes": "Brief: deliberations began 11:55 a.m.; verdict note 3:23 p.m. (Br. 17). Special findings on Counts One-Three: heroin 1 kg+, cocaine 5 kg+, LSD 10 g+, methamphetamine 500 g+ (Tr. 2335:1-2336:13); the Count Two LSD line reads \"ten kilograms\" (Tr. 2335:23), likely a transcription error. Jury polled (Tr. 2337:9-2338:14). ECF 230 p.11 says three-and-a-half hours of deliberation. Session start time 10:06 a.m. (Tr. 2251:9). Counts listed at Tr. 2277:16-2278:7."}, {"id": "A098", "date": "2015-03-25", "prec": "exact", "thread": "rogue", "key": true, "text": "Government filed a criminal complaint in N.D. Cal. against former DEA SA Carl Force and former Secret Service SA Shaun Bridges.", "actors": "USAO-N.D. Cal.; Carl Force; Shaun Bridges", "cites": [{"src": "s15", "loc": "p. 35 (Br. 18)", "quote": "on March 25, 2015, seven weeks after trial concluded in this case, the government filed criminal charges against Force and another participant in the Silk Road investigation"}, {"src": "s6", "loc": "p. 1-3; p. 51", "quote": "Sworn to before me and signed in my presence. Date: 03/25/2015"}], "notes": "Bridges case: No. CR 15-319 (RS) (N.D. Cal.) (Br. 23). Complaint unsealed 2015-03-30 per SDNY letter (ECF 226). NSA-4 (Case3:15-mj-70370, Document 3 filed 03/25/15) is image-only; its OCR was not available. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."}, {"id": "A100", "date": "2015-04-27", "prec": "exact", "thread": "after", "key": true, "text": "Court denied the Rule 33 motion, finding the Force/Bridges material and late 3500 production not Brady and the evidence \"overwhelming.\"", "actors": "Judge Forrest", "cites": [{"src": "s44", "loc": "p. 25", "quote": "For the reasons set forth above, Ulbricht’s motion for a new trial is DENIED."}, {"src": "s44", "loc": "p. 16-19, 25", "quote": "The Government’s failure to reveal more regarding the investigation of either individual violated neither its discovery nor its Brady obligations."}], "notes": "Court: \"Rogue Agents\" did not take part in the SDNY investigation and no trial evidence came from the Baltimore probe (p.17)."}, {"id": "A101", "date": "2015-05-29", "prec": "exact", "thread": "after", "key": true, "text": "Ulbricht sentenced principally to life imprisonment; court found by a preponderance he commissioned five murders and that six drug deaths were related conduct.", "actors": "Judge Forrest", "cites": [{"src": "s1", "loc": "p. 28 (App. 26a)", "quote": "Ulbricht’s sentencing hearing took place on May 29, 2015."}, {"src": "s12", "loc": "p. 1, 3 (Judgment, ECF 269)", "quote": "Counts Two (2) and Four (4): Life to run concurrently; Count (5): Five (5) Years to run concurrently"}, {"src": "s5", "loc": "p. 21", "quote": "His sentencing took place on May 29, 2015, with another trial waiting for a murder-to-hire plot in Baltimore."}], "notes": "Counts One and Three vacated as lesser included offenses; life on Counts Two and Four (App. 26a n.22; Br. 19). Letters of support: 97 (2d Cir) vs 99 (Br. 19). CONFLICT ON DATE: Judgment lists 5/29/2015 as \"Date of Imposition of Judgment\" and transcript ECF 277 is of sentencing held 5/29/2015; docket minute entry says \"Sentencing held on 6/1/2015\" and judgment filed 6/1/15. Lacson & Jones (secondary) also say May 29, 2015. SECONDARY SOURCE (Lacson & Jones, Int'l J. of Cyber Criminology 10(1), 2016). ERROR in source: the NDCA defendants were a DEA agent (Force) and a Secret Service agent (Bridges), not FBI agents; its \"$33 million\" seized figure is uncorroborated here."}, {"id": "D101", "date": "2015-08-31", "prec": "exact", "thread": "rogue", "key": true, "text": "Bridges pleaded guilty before Judge Richard Seeborg (N.D. Cal., CR 15-319 RS) to money laundering (18 U.S.C. 1957) and obstruction of justice (18 U.S.C. 1512(c)(2)); sentencing set for Dec. 7, 2015.", "actors": "Shaun W. Bridges; Judge Richard Seeborg; AUSAs Haun, Frentzen; PIN Trial Atty Evans", "cites": [{"src": "s10", "loc": "p. 23, Tr. 23:7-17; Tr. 24-25", "quote": "how do you plead, Mr. Bridges? Guilty or not 11 guilty? 12 THE DEFENDANT: Guilty."}], "notes": "Cover page says \"Wednesday August 31, 2015\" but Tr. 3:1 says \"MONDAY\"; 8/31/2015 was a Monday. AUSA Haun referenced an earlier \"Force entry of plea\" (Tr. 3:24-25) without date. Govt raised Bridges' attempts to change name/SSN; court added conditions, no remand."}, {"id": "A107", "date": "2017-05-31", "prec": "exact", "thread": "after", "key": true, "text": "Second Circuit (Lynch, J.) affirmed the conviction and life sentence in all respects.", "actors": "U.S. Court of Appeals for the Second Circuit", "cites": [{"src": "s1", "loc": "p. 6 (App. 4a)", "quote": "Because we identify no reversible error, we AFFIRM Ulbricht’s conviction and sentence in all respects."}, {"src": "s56", "loc": "line 348 (ECF 296)", "quote": "Ordered, Adjudged and Decreed that the judgment of the District Court is AFFIRMED."}], "notes": "Decided May 31, 2017 (App. 3a). Mandate date; opinion date not given in index line."}, {"id": "D114", "date": "2025-01-21", "prec": "exact", "thread": "after", "key": true, "text": "Executive grant of clemency: the President granted Ulbricht a full and unconditional pardon.", "actors": "President of the United States; Ulbricht", "cites": [{"src": "s56", "loc": "line 474 (ECF 403)", "quote": "The President of the U. S. grants a full and unconditional pardon to the defendant."}], "notes": "Docket entry entered 1/28/2025."}], "disputes": [{"title": "When Silk Road launched", "text": "The transaction database starts on Feb 6, 2011, and the clearnet domain was registered Feb 28, 2011. A 2013 HSI draft affidavit said March 2011. The civil forfeiture complaint SA Alford signed said the site 'in its current form' dates to June 18, 2011, and the defense leaned on that date.", "refs": ["C007"]}, {"title": "How the FBI found the Iceland server", "text": "Tarbell's declaration says the real IP leaked through the login/CAPTCHA page in early June 2013. The defense's Horowitz declaration called that account implausible given the server configuration. The government said no contemporaneous records exist beyond a 19-line log excerpt, and disclosed that Iceland had imaged a different server ('Server-1') around June 6, 2013. The court never reached the merits, ruling Ulbricht lacked standing.", "refs": ["A035", "A080"]}, {"title": "Server access in July vs. takedown in October", "text": "Iceland imaged the server on July 23, 2013 and the FBI had a copy by about July 29. The site kept running until Oct 2. The defense pressed this gap at trial.", "refs": ["A043", "A061"]}, {"title": "Pen/trap order dates", "text": "Tarbell gives Sept 17–20, 2013. The court's list starts with an order on Sept 16, and sources differ on the date of the second order.", "refs": ["A052"]}, {"title": "Value of the laptop bitcoins", "text": "The 144,000 BTC on the laptop are valued at $16–18 million at arrest by the court and the government, and at $29 million at seizure in defense cross-ex         var bad = d.refs.filter(function (r) { return !eventOf(r); });
        return '<div class="citeed" data-di="' + i + '"><div class="top" style="grid-template-columns:minmax(0,1fr) auto"><label class="field"><span>What is disputed</span><input data-df="title" value="' + esc(d.title) + '" placeholder="When the site launched"></label><button class="btn small danger" data-ddel aria-label="Remove dispute">Remove</button></div>' +
          '<label class="field"><span>How the sources differ</span><textarea data-df="text" rows="3">' + esc(d.text) + '</textarea></label><label class="field"><span>Events involved</span><input data-df="refs" value="' + esc(d.refs.join(', ')) + '" placeholder="e12, e14"><small' + (bad.length ? ' style="color:var(--fix)">Not events: ' + esc(bad.join(', ')) : '>Comma-separated event IDs') + '</small></label></div>';
      }).join('') + '</div><div class="row"><button class="btn primary" id="addDisp">Add dispute</button></div></div>' +
      '<div class="form"><h2>What the sources don\'t cover</h2><p class="hint">Gaps in your material: documents you could not get, questions the record does not answer. One per line.</p><label class="field"><span>Gaps</span><textarea id="gaps" rows="8">' + esc(P.gaps.join('\n')) + '</textarea></label></div></div>';
  }
  document.addEventListener('input', function (ev) {
    if (ui.mode !== 'edit' || ui.etab !== 'disputes') return;
    if (ev.target.id === 'gaps') { P.gaps = ev.target.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); return touch(); }
    var r = ev.target.closest('[data-di]'), k = ev.target.dataset.df; if (!r || !k) return;
    var d = P.disputes[+r.dataset.di];
    if (k === 'refs') { d.refs = ev.target.value.split(/[,\s]+/).map(function (x) { return x.trim(); }).filter(Boolean); var bad = d.refs.filter(function (x) { return !eventOf(x); }), sm = ev.target.nextElementSibling; sm.style.color = bad.length ? 'var(--fix)' : ''; sm.textContent = bad.length ? 'Not events: ' + bad.join(', ') : 'Comma-separated event IDs'; }
    else d[k] = ev.target.value;
    touch();
  });
  document.addEventListener('click', function (ev) {
    if (ui.mode !== 'edit' || ui.etab !== 'disputes') return;
    if (ev.target.id === 'addDisp') { P.disputes.push({ title: '', text: '', refs: [] }); touch(); return edDisputes(); }
    if (ev.target.hasAttribute('data-ddel')) { P.disputes.splice(+ev.target.closest('[data-di]').dataset.di, 1); touch(); edDisputes(); }
  });

  // --- page ---
  function edPage() {
    var m = P.meta, f = function (k, l, ph, help, area) { return '<label class="field wide"><span>' + l + '</span>' + (area ? '<textarea data-mf="' + k + '" rows="3" placeholder="' + esc(ph) + '">' + esc(m[k]) + '</textarea>' : '<input data-mf="' + k + '" value="' + esc(m[k]) + '" placeholder="' + esc(ph) + '">') + (help ? '<small>' + help + '</small>' : '') + '</label>'; };
    $('epane').innerHTML = '<div class="form" style="margin-block:16px 60px"><h2>Page</h2>' + f('title', 'Title', 'Silk Road Takedown Timeline', 'The name of the page. Also the browser tab title of an exported page.') + f('eyebrow', 'Line above the title', 'Case file · United States v. Ulbricht') + f('dek', 'Summary', 'One or two sentences on what the timeline covers and what it is built from', '', true) +
      '<div class="fgrid">' + f('byline', 'Byline', 'Your name or outlet') + f('compiled', 'Compiled on', '2026-10-22', 'When the timeline was first put together.') + '</div>' +
      '<h3>Version</h3><p class="hint">Optional. Kept apart from the compiled date, so readers can tell which revision they are looking at. Shown beside the title and in the footer.</p>' +
      '<div class="fgrid">' + f('version', 'Version', '1.1') + '<label class="field wide"><span>Version date</span><input data-mf="versionDate" value="' + esc(m.versionDate) + '" placeholder="2026-10-25"><small><button class="btn small" type="button" id="vtoday">Today</button></small></label></div>' +
      f('versionNote', 'What changed', 'Added the October 2026 Starshield events', 'One line. Shown in the footer, and when a reader points at the version tag.') + f('license', 'License or credit line', 'CC BY 4.0', 'Shown in the footer of the published page.') + '</div>';
  }
  document.addEventListener('click', function (ev) { if (ev.target.id !== 'vtoday') return; var t = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; }; P.meta.versionDate = t.getFullYear() + '-' + z(t.getMonth() + 1) + '-' + z(t.getDate()); touch(); edPage(); });
  document.addEventListener('input', function (ev) { var k = ev.target.dataset && ev.target.dataset.mf; if (!k) return; P.meta[k] = ev.target.value; if (k === 'title') document.title = ev.target.value + ' · OSINT Timeline Builder'; touch(); });

  // --- check ---
  function edAudit() {
    var a = TL.audit(P, O, TYPES, TEXT_KEYS), fix = a.rows.filter(function (r) { return r.level === 'fix'; }).length;
    $('epane').innerHTML = '<div class="form" style="margin-block:16px 60px"><h2>Check the timeline</h2><p class="hint">' + a.events + ' events, ' + a.sources + ' sources. ' + (a.rows.length ? fix + ' to fix, ' + (a.rows.length - fix) + ' to check.' : '<span class="ok">Nothing to fix.</span>') + (a.unrated ? ' ' + a.unrated + ' source' + (a.unrated > 1 ? 's are' : ' is') + ' unrated; ratings are optional but expected on any source a reader might question.' : '') + '</p>' +
      '<div class="audit">' + a.rows.slice(0, 400).map(function (r) { return '<div class="item ' + r.level + '"><span class="lvl">' + r.level + '</span><span>' + esc(r.msg) + '</span>' + (eventOf(r.where) ? '<button class="btn small" data-goev="' + esc(r.where) + '">Open</button>' : r.where === 'background' ? '<button class="btn small" data-etab="background">Open</button>' : sourceOf(r.where) ? '<button class="btn small" data-gosrc="' + esc(r.where) + '">Open</button>' : '<span></span>') + '</div>'; }).join('') + (a.rows.length > 400 ? '<p class="hint">…and ' + (a.rows.length - 400) + ' more.</p>' : '') + '</div></div>';
  }
  document.addEventListener('click', function (ev) {
    var g = ev.target.closest('[data-goev]'); if (g) { ui.eid = g.dataset.goev; ui.etab = 'events'; ui.eq = ''; return renderEdit(); }
    var s = ev.target.closest('[data-gosrc]'); if (s) { ui.sid = s.dataset.gosrc; ui.etab = 'sources'; ui.sq = ''; return renderEdit(); }
  });

  // ---------- top-level ----------
  function render() {
    document.title = P.meta.title + (PUBLISHED ? '' : ' · OSINT Timeline Builder');
    renderBar();
    $('view').hidden = ui.mode !== 'view'; $('edit').hidden = ui.mode !== 'edit'; popClose();
    if (ui.mode === 'view') $('edit').innerHTML = ''; else $('view').innerHTML = '';
    if (ui.mode === 'view') { ui.threads = ui.threads || null; renderView(); } else renderEdit();
  }
  window.addEventListener('beforeunload', function (e) { if (!PUBLISHED && fileDirty && !savedAt) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('dragover', function (e) { if (!PUBLISHED) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (PUBLISHED) return; e.preventDefault(); var f = e.dataTransfer.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { openText(f.name, String(r.result)); }; r.readAsText(f); });
  render();
  if (/^#[\w.-]+$/.test(location.hash) && eventOf(location.hash.slice(1))) setTimeout(function () { jump(location.hash.slice(1)); }, 150);
})();
</script>
</body>
